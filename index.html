<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto Donate</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#0b0b0b;
    --bg2:#111;
    --text:#fff;
    --sub:#9a9a9a;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,sans-serif;
}

body{
    background:
    radial-gradient(circle at top,#151515,#0b0b0b),
    radial-gradient(#ffffff10 1px, transparent 1px);
    background-size:auto, 18px 18px;
    color:var(--text);
    min-height:100vh;
}

.container{
    width:min(1100px,92%);
    margin:auto;
    padding:50px 0;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:35px;
}

h1{
    font-size:52px;
}

p{
    color:var(--sub);
}

/* cards */

.cards{
    display:flex;
    flex-direction:column;
    gap:16px;
}

.card{
    position:relative;

    padding:22px;
    border-radius:22px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    transition:.15s ease;
    overflow:hidden;
}

/* glow */

.card::before{
    content:"";
    position:absolute;
    inset:0;

    background:radial-gradient(
        circle at var(--mx,50%) var(--my,50%),
        rgba(var(--c),0.55),
        rgba(var(--c),0.15),
        transparent 60%
    );

    opacity:0;
    transition:.15s;
}

.card.active::before{
    opacity:1;
}

/* hover glow */

.card:hover{
    box-shadow:
        0 0 25px rgba(var(--c),0.35),
        0 0 60px rgba(var(--c),0.15);
}

/* colors */

.btc{ --c:255,204,0; }
.eth{ --c:155,123,255; }
.ton{ --c:46,139,255; }
.trx{ --c:255,59,59; }
.usdt{ --c:45,255,143; }

/* featured trx */

.trx{
    border:1px solid rgba(255,59,59,0.35);
    transform:scale(1.02);
    box-shadow:0 0 35px rgba(255,59,59,0.15);
}

.trx::after{
    content:"FEATURED";
    position:absolute;
    top:12px;
    right:14px;

    font-size:10px;
    letter-spacing:2px;

    color:#ff3b3b;
    opacity:.9;
}

/* content */

.left{
    display:flex;
    gap:18px;
    align-items:center;
    z-index:2;
}

.icon{
    width:70px;
    height:70px;

    border-radius:18px;

    overflow:hidden;

    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.08);

    flex-shrink:0;
}

/* images */

.icon img{
    width:100%;
    height:100%;

    object-fit:cover;

    filter:
        grayscale(1)
        brightness(.8);

    opacity:.7;

    transition:.25s;
}

.card:hover .icon img{
    filter:none;
    opacity:1;
    transform:scale(1.08);
}

h2{
    font-size:20px;
}

.addr{
    font-size:13px;
    color:var(--sub);
    display:flex;
    flex-wrap:wrap;
    max-width:600px;
    word-break:break-all;
    z-index:2;
}

/* scramble */

.char{
    display:inline-block;
    filter:blur(2px);
    opacity:.6;
    transition:.2s;
}

.card:hover .char{
    filter:blur(0);
    opacity:1;
}

/* button */

.copy{
    border:none;
    background:rgba(255,255,255,0.08);
    color:#fff;

    padding:12px 16px;

    border-radius:14px;
    cursor:pointer;

    z-index:2;

    transition:.15s;
}

.copy:hover{
    background:rgba(255,255,255,0.14);
}

.copy:active{
    transform:scale(0.95);
}

</style>
</head>

<body>

<div class="container">

<div class="top">
    <div>
        <h1>CRYPTO</h1>
        <p>donate ⚡</p>
    </div>
</div>

<div class="cards">

<!-- TRX -->

<div class="card trx">
    <div class="left">

        <div class="icon">
            <img src="trx.png">
        </div>

        <div>
            <h2>TRON (TRX)</h2>
            <div class="addr" data-value="TX6fxoYfeCDZKPogFURTkm9uYmCtFzfS8q"></div>
        </div>

    </div>

    <button class="copy">COPY</button>
</div>

<!-- USDT -->

<div class="card usdt">
    <div class="left">

        <div class="icon">
            <img src="usdt.png">
        </div>

        <div>
            <h2>USDT (TRC20)</h2>
            <div class="addr" data-value="TX6fxoYfeCDZKPogFURTkm9uYmCtFzfS8q"></div>
        </div>

    </div>

    <button class="copy">COPY</button>
</div>

<!-- TON -->

<div class="card ton">
    <div class="left">

        <div class="icon">
            <img src="ton.png">
        </div>

        <div>
            <h2>TON</h2>
            <div class="addr" data-value="UQA0Yo-H-9zDlU6Smm1fOxtugcduS6vdO_rQDARqFRPFSwNI"></div>
        </div>

    </div>

    <button class="copy">COPY</button>
</div>

<!-- ETH -->

<div class="card eth">
    <div class="left">

        <div class="icon">
            <img src="eth.png">
        </div>

        <div>
            <h2>ETHEREUM (ETH)</h2>
            <div class="addr" data-value="0x8355c60e67cF317A5D5afa1758ab8BD228DAf09B"></div>
        </div>

    </div>

    <button class="copy">COPY</button>
</div>

<!-- BTC -->

<div class="card btc">
    <div class="left">

        <div class="icon">
            <img src="btc.png">
        </div>

        <div>
            <h2>BITCOIN (BTC)</h2>
            <div class="addr" data-value="bc1q65uh43gzezzx0hls2p2tnxx2n5xafwsz5q8k0s"></div>
        </div>

    </div>

    <button class="copy">COPY</button>
</div>

</div>

</div>

<script>

const isMobile = window.matchMedia("(pointer: coarse)").matches;

/* scramble */

function randChar(){

    const c="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

    return c[Math.floor(Math.random()*c.length)];
}

function scramble(el){

    const v=el.dataset.value;

    el.innerHTML="";

    for(let i=0;i<v.length;i++){

        const s=document.createElement("span");

        s.className="char";
        s.dataset.real=v[i];
        s.innerText=randChar();

        el.appendChild(s);
    }
}

function reveal(el,dir){

    let chars=[...el.querySelectorAll(".char")];

    if(dir==="rtl") chars=chars.reverse();

    chars.forEach((c,i)=>{

        setTimeout(()=>{

            c.innerText=c.dataset.real;

        },i*20);

    });
}

function reset(el){

    scramble(el);
}

/* cards */

document.querySelectorAll(".card").forEach(card=>{

    const addr=card.querySelector(".addr");

    scramble(addr);

    let dir="ltr";

    if(!isMobile){

        card.addEventListener("mousemove",(e)=>{

            const r=card.getBoundingClientRect();

            const x=e.clientX-r.left;
            const y=e.clientY-r.top;

            card.style.setProperty("--mx",(x/r.width)*100+"%");
            card.style.setProperty("--my",(y/r.height)*100+"%");

            card.classList.add("active");

            dir=(x>r.width/2) ? "rtl" : "ltr";
        });

        card.addEventListener("mouseleave",()=>{

            card.classList.remove("active");

            reset(addr);
        });

        card.addEventListener("mouseenter",()=>{

            reveal(addr,dir);
        });

    }else{

        card.addEventListener("touchstart",()=>{

            card.classList.add("active");

            reveal(addr,"rtl");
        });

        card.addEventListener("touchend",()=>{

            card.classList.remove("active");

            reset(addr);
        });
    }

});

/* copy */

document.querySelectorAll(".copy").forEach(btn=>{

    btn.addEventListener("click",async()=>{

        const card=btn.closest(".card");

        const addr=card.querySelector(".addr").dataset.value;

        await navigator.clipboard.writeText(addr);

        const old=btn.innerText;

        btn.innerText="COPIED";

        setTimeout(()=>{

            btn.innerText=old;

        },1200);

    });

});

</script>

</body>
</html>
